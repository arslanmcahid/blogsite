# Yerel geliştirme: sadece PostgreSQL'i Docker'da çalıştırıp backend/frontend'i
# doğrudan makinede çalıştırmak en rahatıdır:  docker compose up -d db
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
